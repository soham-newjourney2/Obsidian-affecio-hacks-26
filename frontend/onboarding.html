<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECHO</title>
  <meta name="theme-color" content="#10251b">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/storybook-theme.css">
  <link rel="stylesheet" href="/css/pages/onboarding.css">
  <script type="module" src="/js/pages/onboarding.js"></script>
</head>
<body class="page-onboarding">
  <a class="skip-link" href="#main" data-s="common.skip"></a>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand brand--light sidebar__brand" href="/lobby.html" data-s-label="nav.lobby">
        <img class="brand__mark" src="/assets/brand/emblem.svg" alt="" width="48" height="64">
        <span class="brand__name" data-s="common.brand"></span>
      </a>

      <nav class="stepper" data-s-label="onboarding.stepsLabel">
        <ol class="stepper__list">
          <li><button class="stepper__item" type="button" data-goto="1">
            <span class="stepper__icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-sparkle"></use></svg></span>
            <span class="stepper__text"><span class="stepper__title" data-s="onboarding.steps.welcome.title"></span><span class="stepper__sub" data-s="onboarding.steps.welcome.sub"></span></span>
          </button></li>
          <li><button class="stepper__item" type="button" data-goto="2">
            <span class="stepper__icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-heart"></use></svg></span>
            <span class="stepper__text"><span class="stepper__title" data-s="onboarding.steps.interests.title"></span><span class="stepper__sub" data-s="onboarding.steps.interests.sub"></span></span>
          </button></li>
          <li><button class="stepper__item" type="button" data-goto="3">
            <span class="stepper__icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-dice"></use></svg></span>
            <span class="stepper__text"><span class="stepper__title" data-s="onboarding.steps.playstyle.title"></span><span class="stepper__sub" data-s="onboarding.steps.playstyle.sub"></span></span>
          </button></li>
          <li><button class="stepper__item" type="button" data-goto="4">
            <span class="stepper__icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-quill"></use></svg></span>
            <span class="stepper__text"><span class="stepper__title" data-s="onboarding.steps.about.title"></span><span class="stepper__sub" data-s="onboarding.steps.about.sub"></span></span>
          </button></li>
          <li><button class="stepper__item" type="button" data-goto="5">
            <span class="stepper__icon"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-key"></use></svg></span>
            <span class="stepper__text"><span class="stepper__title" data-s="onboarding.steps.done.title"></span><span class="stepper__sub" data-s="onboarding.steps.done.sub"></span></span>
          </button></li>
        </ol>
      </nav>

      <div class="sidebar__art" aria-hidden="true"></div>
    </aside>

    <div class="app-main onboarding-main">
      <header class="app-topbar">
        <span class="user-chip"><span class="avatar" data-user-initial aria-hidden="true"></span><span class="app-header__user" id="user-name"></span></span>
        <button class="btn btn--ghost btn--sm" type="button" id="sign-out" data-s="nav.signOut"></button>
      </header>

      <main id="main" class="onboarding">
        <h1 class="visually-hidden" data-s="onboarding.title"></h1>

        <div class="progress" id="progress" hidden>
          <p class="progress__label" id="progress-label"></p>
          <div class="progress__track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1">
            <span class="progress__fill" id="progress-fill"></span>
          </div>
        </div>

        <div id="page-state" class="state" role="status" aria-live="polite"></div>

        <form id="profile-form" class="form onboarding__form" method="post" novalidate hidden>
          <p class="form-error" role="alert" hidden></p>

          <section class="step step--welcome" data-step="1" aria-labelledby="step-1-title">
            <header class="step__intro">
              <h2 class="step__title" id="step-1-title" tabindex="-1" data-s="onboarding.welcome.title"></h2>
              <p class="step__lede" data-s="onboarding.welcome.lede"></p>
            </header>
            <ul class="welcome-cards">
              <li class="welcome-card">
                <span class="welcome-card__art welcome-card__art--books" aria-hidden="true"></span>
                <h3 class="welcome-card__title" data-s="onboarding.welcome.cards.games.title"></h3>
                <p class="welcome-card__body" data-s="onboarding.welcome.cards.games.body"></p>
              </li>
              <li class="welcome-card">
                <span class="welcome-card__art welcome-card__art--people" aria-hidden="true"></span>
                <h3 class="welcome-card__title" data-s="onboarding.welcome.cards.people.title"></h3>
                <p class="welcome-card__body" data-s="onboarding.welcome.cards.people.body"></p>
              </li>
              <li class="welcome-card">
                <span class="welcome-card__art welcome-card__art--compass" aria-hidden="true"></span>
                <h3 class="welcome-card__title" data-s="onboarding.welcome.cards.gm.title"></h3>
                <p class="welcome-card__body" data-s="onboarding.welcome.cards.gm.body"></p>
              </li>
            </ul>
          </section>

          <section class="step" data-step="2" aria-labelledby="step-2-title" hidden>
            <header class="step__intro">
              <h2 class="step__title" id="step-2-title" tabindex="-1" data-s="onboarding.interests.title"></h2>
              <p class="step__lede" data-s="onboarding.interests.lede"></p>
            </header>
            <div class="onboarding__sections" data-sections="2"></div>
          </section>

          <section class="step" data-step="3" aria-labelledby="step-3-title" hidden>
            <header class="step__intro">
              <h2 class="step__title" id="step-3-title" tabindex="-1" data-s="onboarding.playstyle.title"></h2>
              <p class="step__lede" data-s="onboarding.playstyle.lede"></p>
            </header>
            <div class="onboarding__sections" data-sections="3"></div>
          </section>

          <section class="step" data-step="4" aria-labelledby="step-4-title" hidden>
            <header class="step__intro">
              <h2 class="step__title" id="step-4-title" tabindex="-1" data-s="onboarding.about.title"></h2>
              <p class="step__lede" data-s="onboarding.about.lede"></p>
            </header>
            <div class="onboarding__sections" data-sections="4"></div>
          </section>

          <section class="step" data-step="5" aria-labelledby="step-5-title" hidden>
            <header class="step__intro">
              <h2 class="step__title" id="step-5-title" tabindex="-1" data-s="onboarding.done.title"></h2>
              <p class="step__lede" id="done-lede"></p>
            </header>
            <dl class="review" id="review"></dl>
          </section>

          <div class="onboarding__actions">
            <p class="onboarding__quote" id="quote" data-s="onboarding.welcome.quote"></p>
            <button class="btn btn--ghost btn--lg" type="button" id="back">
              <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow-left"></use></svg>
              <span data-s="onboarding.back"></span>
            </button>
            <button class="btn btn--primary btn--lg" type="button" id="next">
              <span id="next-label"></span>
              <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow"></use></svg>
            </button>
            <button class="btn btn--seal btn--lg" type="submit" id="save"></button>
          </div>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
