<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECHO</title>
  <meta name="theme-color" content="#10251b">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/storybook-theme.css">
  <link rel="stylesheet" href="/css/temp.css">
  <script type="module" src="/js/pages/results.js"></script>
</head>
<body class="page-results">
  <a class="skip-link" href="#main" data-st="common.skip"></a>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand brand--light sidebar__brand" href="/lobby.html" data-st-label="common.lobby">
        <img class="brand__mark" src="/assets/brand/emblem.svg" alt="" width="48" height="64">
        <span class="brand__name" data-st="common.brand"></span>
      </a>
      <nav class="sidebar__nav" data-st-label="common.navLabel">
        <a class="sidebar__link" href="/lobby.html">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-home"></use></svg>
          <span data-st="common.lobby"></span>
        </a>
        <a class="sidebar__link" href="/room.html">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-users"></use></svg>
          <span data-st="common.table"></span>
        </a>
        <a class="sidebar__link" href="/onboarding.html">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-user"></use></svg>
          <span data-st="common.profile"></span>
        </a>
      </nav>
      <div class="sidebar__footer">
        <button class="sidebar__link" type="button" id="sign-out">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-logout"></use></svg>
          <span data-st="common.signOut"></span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <a class="user-chip" href="/onboarding.html">
          <span class="avatar" id="user-initial" aria-hidden="true"></span>
          <span class="app-header__user" id="user-name"></span>
        </a>
      </header>

      <main id="main" class="results-page">
        <div id="page-state" class="state" role="status" aria-live="polite"></div>

        <section id="still-playing" class="panel results-card" hidden>
          <h1 class="results-card__title" data-st="results.active.title"></h1>
          <p data-st="results.active.body"></p>
          <a class="btn btn--primary" id="back-to-room" href="/room.html" data-st="results.active.back"></a>
        </section>

        <div id="results" class="results" hidden>
          <!-- The ending reveal -->
          <section class="panel results-ending" aria-labelledby="ending-title">
            <p class="eyebrow" id="results-story"></p>
            <p id="results-stamp" class="game-stamp results-stamp" aria-hidden="true"></p>
            <h1 id="ending-title" class="results-ending__title"></h1>
            <p id="ending-text" class="results-ending__text"></p>
            <h2 class="results-card__subtitle" data-st="results.solution"></h2>
            <p id="solution" class="results-ending__solution"></p>
          </section>

          <!-- What the table did together -->
          <section class="panel results-card" aria-labelledby="team-title">
            <h2 id="team-title" class="results-card__subtitle" data-st="results.team.title"></h2>
            <p id="recap" class="results-recap"></p>
            <dl class="results-stats" id="team-stats"></dl>
            <h3 class="results-card__minor" data-st="results.team.path"></h3>
            <ol id="chapters" class="results-chapters"></ol>
            <h3 class="results-card__minor" data-st="results.team.players"></h3>
            <ul id="players" class="results-players"></ul>
          </section>

          <!-- Private reflection -->
          <section class="panel results-card results-private" aria-labelledby="you-title">
            <h2 id="you-title" class="results-card__subtitle" data-st="results.you.title"></h2>
            <p class="hint">🔒 <span data-st="results.you.private"></span></p>
            <ul id="you-facts" class="results-facts"></ul>
            <ul id="badges" class="results-badges"></ul>
            <p id="badges-empty" class="game-empty" data-st="results.you.noBadges" hidden></p>
          </section>

          <!-- The 2-question pulse -->
          <section class="panel results-card" aria-labelledby="pulse-title">
            <h2 id="pulse-title" class="results-card__subtitle" data-st="results.pulse.title"></h2>
            <form id="pulse-form" class="form results-pulse" method="post" novalidate>
              <p class="form-error" role="alert" hidden></p>
              <fieldset class="results-question" id="q-play">
                <legend class="label" data-st="results.pulse.playAgain"></legend>
                <div class="choices" id="play-again"></div>
              </fieldset>
              <fieldset class="results-question" id="q-ease">
                <legend class="label" data-st="results.pulse.ease"></legend>
                <div class="results-scale" id="ease"></div>
                <p class="hint results-scale__ends"><span data-st="results.pulse.hard"></span><span data-st="results.pulse.easy"></span></p>
              </fieldset>
              <p class="hint" data-st="results.pulse.why"></p>
              <button class="btn btn--seal" type="submit" disabled data-st="results.pulse.submit"></button>
            </form>
            <p id="pulse-thanks" class="results-thanks" role="status" data-st="results.pulse.thanks" hidden></p>
          </section>

          <nav class="results-actions" data-st-label="results.actionsLabel">
            <a class="btn btn--primary" href="/room.html" data-st="results.playAgain"></a>
            <a class="btn btn--ghost" href="/lobby.html" data-st="common.lobby"></a>
          </nav>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
