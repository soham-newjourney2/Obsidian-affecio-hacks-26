<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECHO</title>
  <meta name="theme-color" content="#10251b">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/storybook-theme.css">
  <link rel="stylesheet" href="/css/temp.css">
  <script type="module" src="/js/pages/connections.js"></script>
</head>
<body class="page-connections">
  <a class="skip-link" href="#main" data-st="common.skip"></a>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand brand--light sidebar__brand" href="/lobby.html" data-st-label="common.lobby">
        <img class="brand__mark" src="/assets/brand/emblem.svg" alt="" width="48" height="64">
        <span class="brand__name" data-st="common.brand"></span>
      </a>
      <nav class="sidebar__nav" data-st-label="common.navLabel">
        <a class="sidebar__link" href="/lobby.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-home"></use></svg><span data-st="common.lobby"></span></a>
        <a class="sidebar__link" href="/room.html"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-users"></use></svg><span data-st="common.table"></span></a>
        <a class="sidebar__link" href="/connections.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-message"></use></svg><span data-st="connections.title"></span></a>
      </nav>
      <div class="sidebar__footer">
        <button class="sidebar__link" type="button" id="sign-out"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-logout"></use></svg><span data-st="common.signOut"></span></button>
      </div>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <a class="user-chip" href="/onboarding.html"><span class="avatar" id="user-initial" aria-hidden="true"></span><span class="app-header__user" id="user-name"></span></a>
      </header>
      <main id="main" class="results-page">
        <div id="page-state" class="state" role="status" aria-live="polite"></div>
        <div id="content" class="results" hidden>
          <header>
            <h1 class="results-card__title" data-st="connections.title"></h1>
            <p class="hint" data-st="connections.lede"></p>
          </header>
          <section class="panel results-card" aria-labelledby="incoming-title" id="incoming-panel">
            <h2 id="incoming-title" class="results-card__subtitle" data-st="connections.incoming"></h2>
            <ul id="incoming" class="results-connect"></ul>
          </section>
          <section class="panel results-card" aria-labelledby="connections-title">
            <h2 id="connections-title" class="results-card__subtitle" data-st="connections.title"></h2>
            <ul id="connections" class="results-connect"></ul>
            <p id="none" class="game-empty" data-st="connections.none" hidden></p>
          </section>
          <section class="panel results-card" aria-labelledby="outgoing-title" id="outgoing-panel">
            <h2 id="outgoing-title" class="results-card__subtitle" data-st="connections.outgoing"></h2>
            <ul id="outgoing" class="results-connect"></ul>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
