<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECHO</title>
  <meta name="theme-color" content="#10251b">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/storybook-theme.css">
  <link rel="stylesheet" href="/css/pages/lobby.css">
  <script type="module" src="/js/pages/lobby.js"></script>
</head>
<body class="page-lobby">
  <a class="skip-link" href="#main" data-s="common.skip"></a>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand brand--light sidebar__brand" href="/lobby.html" data-s-label="nav.lobby">
        <img class="brand__mark" src="/assets/brand/emblem.svg" alt="" width="48" height="64">
        <span class="brand__name" data-s="common.brand"></span>
      </a>

      <nav class="sidebar__nav" data-s-label="lobby.navLabel">
        <a class="sidebar__link" href="/lobby.html" aria-current="page">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-home"></use></svg>
          <span data-s="lobby.nav.home"></span>
        </a>
        <button class="sidebar__link" type="button" data-soon>
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-compass"></use></svg>
          <span data-s="lobby.nav.find"></span>
        </button>
        <button class="sidebar__link" type="button" data-soon>
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-layers"></use></svg>
          <span data-s="lobby.nav.games"></span>
        </button>
        <button class="sidebar__link" type="button" data-soon>
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-users"></use></svg>
          <span data-s="lobby.nav.community"></span>
        </button>
        <button class="sidebar__link" type="button" data-soon>
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-message"></use></svg>
          <span data-s="lobby.nav.messages"></span>
        </button>
        <a class="sidebar__link" href="/onboarding.html">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-user"></use></svg>
          <span data-s="lobby.nav.profile"></span>
        </a>
      </nav>

      <div class="sidebar__art" aria-hidden="true"></div>
      <div class="sidebar__footer">
        <button class="sidebar__link" type="button" id="sign-out">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-logout"></use></svg>
          <span data-s="nav.signOut"></span>
        </button>
      </div>
    </aside>

    <div class="app-main lobby-main">
      <header class="app-topbar lobby-topbar">
        <form class="search" role="search" id="search">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-search"></use></svg>
          <input class="search__input" type="search" name="q" autocomplete="off" data-s-label="lobby.searchLabel" data-s-placeholder="lobby.searchPlaceholder">
        </form>
        <button class="icon-btn" type="button" id="notifications" data-s-label="lobby.notifications">
          <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-bell"></use></svg>
        </button>
        <a class="user-chip" href="/onboarding.html">
          <span class="avatar" data-user-initial aria-hidden="true"></span>
          <span class="app-header__user" id="user-name"></span>
        </a>
      </header>

      <main id="main" class="lobby">
        <div id="page-state" class="state" role="status" aria-live="polite"></div>

        <div id="lobby-content" class="lobby__content" hidden>
          <section class="lobby-hero" aria-labelledby="lobby-hero-title">
            <p id="welcome" class="lobby-hero__welcome"></p>
            <h1 id="lobby-hero-title" class="lobby-hero__title" data-s="lobby.hero.title"></h1>
            <p class="lobby-hero__body" data-s="lobby.hero.body"></p>
            <div class="lobby-hero__actions">
              <button class="btn btn--primary" type="button" data-soon>
                <span data-s="lobby.hero.cta"></span>
                <svg class="icon" aria-hidden="true"><use href="/assets/icons.svg#i-arrow"></use></svg>
              </button>
              <a class="btn btn--glass" href="/onboarding.html" data-s="lobby.editProfile"></a>
            </div>
          </section>

          <section class="lobby-section" aria-labelledby="recommended-title">
            <header class="lobby-section__head">
              <h2 id="recommended-title" class="lobby-section__title" data-s="lobby.recommended"></h2>
              <span class="sample-pill" data-s="common.sample" data-s-title="common.sampleHint"></span>
            </header>
            <ul class="game-grid">
              <li class="game-card game-card--manor">
                <h3 class="game-card__title" data-s="stories.manor.title"></h3>
                <p class="game-card__tags"><span class="tag" data-s="stories.manor.genre"></span><span class="tag" data-s="stories.manor.players"></span><span class="tag" data-s="stories.manor.level"></span></p>
              </li>
              <li class="game-card game-card--expedition">
                <h3 class="game-card__title" data-s="stories.expedition.title"></h3>
                <p class="game-card__tags"><span class="tag" data-s="stories.expedition.genre"></span><span class="tag" data-s="stories.expedition.players"></span><span class="tag" data-s="stories.expedition.level"></span></p>
              </li>
              <li class="game-card game-card--archive">
                <h3 class="game-card__title" data-s="stories.archive.title"></h3>
                <p class="game-card__tags"><span class="tag" data-s="stories.archive.genre"></span><span class="tag" data-s="stories.archive.players"></span><span class="tag" data-s="stories.archive.level"></span></p>
              </li>
            </ul>
          </section>

          <div class="lobby-row">
            <section class="lobby-section" aria-labelledby="people-title">
              <header class="lobby-section__head">
                <h2 id="people-title" class="lobby-section__title" data-s="lobby.people"></h2>
                <span class="sample-pill" data-s="common.sample" data-s-title="common.sampleHint"></span>
              </header>
              <ul class="people" id="people"></ul>
            </section>

            <section class="lobby-section active-card" aria-labelledby="active-title">
              <header class="lobby-section__head">
                <h2 id="active-title" class="lobby-section__title" data-s="lobby.active"></h2>
                <span class="sample-pill" data-s="common.sample" data-s-title="common.sampleHint"></span>
              </header>
              <ul class="active-list" id="active"></ul>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
