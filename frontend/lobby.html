<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECHO</title>
  <meta name="theme-color" content="#0b0f17">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Courier+Prime&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/effects.css">
  <link rel="stylesheet" href="/css/pages/lobby.css">
  <script type="module" src="/js/pages/lobby.js"></script>
</head>
<body class="page-lobby">
  <a class="skip-link" href="#main" data-s="common.skip"></a>
  <header class="site-header app-header">
    <div class="container site-header__inner">
      <a class="brand" href="/lobby.html" data-s-label="nav.lobby">
        <img src="/assets/brand/logo.svg" alt="" width="112" height="34">
      </a>
      <nav class="site-nav" data-s-label="nav.label">
        <span class="app-header__user" id="user-name"></span>
        <a class="site-nav__link" href="/onboarding.html" data-s="nav.profile"></a>
        <button class="btn btn--ghost btn--sm" type="button" id="sign-out" data-s="nav.signOut"></button>
      </nav>
    </div>
  </header>

  <main id="main" class="container lobby">
    <div id="page-state" class="state" role="status" aria-live="polite"></div>

    <div id="lobby-content" class="lobby__content" hidden>
      <header class="lobby__intro">
        <p class="eyebrow" data-s="lobby.eyebrow"></p>
        <h1 id="welcome" class="lobby__title"></h1>
        <a class="lobby__profile-link" href="/onboarding.html" data-s="lobby.editProfile"></a>
      </header>

      <section class="catalogue" aria-labelledby="catalogue-title">
        <div class="catalogue__head">
          <h2 id="catalogue-title" class="catalogue__title" data-s="lobby.catalogueTitle"></h2>
          <p class="catalogue__lede" data-s="lobby.catalogueLede"></p>
        </div>
        <ul id="catalogue" class="catalogue__grid"></ul>
      </section>
    </div>
  </main>

  <dialog id="story-dialog" class="modal story-modal" aria-labelledby="story-title">
    <div class="modal__inner">
      <p class="eyebrow" id="story-number"></p>
      <h2 class="modal__title" id="story-title"></h2>
      <p class="story-modal__inspiration" id="story-inspiration"></p>
      <p class="story-modal__premise typewriter" id="story-premise"></p>
      <div>
        <h3 class="story-modal__heading" data-s="lobby.detail.roles"></h3>
        <ul class="story-modal__roles" id="story-roles"></ul>
      </div>
      <p class="hint" data-s="lobby.detail.roomsSoon"></p>
      <div class="modal__actions">
        <a class="btn btn--ghost" id="story-source" target="_blank" rel="noopener noreferrer"></a>
        <button class="btn btn--primary" type="button" id="story-close" data-s="common.close"></button>
      </div>
    </div>
  </dialog>
</body>
</html>
